# --- MONITOR -------------------------------------------
monitor=,preferred,auto,1

# --- SOURCE CONFIGS ---
source = ~/.config/hypr/configs/env.conf
source = ~/.config/hypr/configs/exec.conf
source = ~/.config/hypr/configs/keybinds.conf
source = ~/.config/hypr/configs/rules.conf

# --- NVIDIA & RENDERING FIX ----------------------------
render {
    direct_scanout = 0
}


# --- WINDOW SETTINGS -----------------------------------
    general {
        layout = master
        border_size = 1
        gaps_in = 2
        # top, right, bottom, left
        gaps_out = 36., 5, 5, 5
        col.active_border = rgba(9c9c9cf2)
        col.inactive_border = rgba(595959c2)
        resize_on_border = true
    }
    
    decoration {
        rounding = 4
    
        # Di versi baru, shadow pindah ke dalam blok sendiri
        shadow {
            enabled = true
            range = 4
            render_power = 3
            color = rgba(1a1a1aee)
        }
    
        # Optional: Biar makin estetik, tambah blur dikit
        blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true # INI KUNCINYA biar blur tetep tebel meski window transparan
        }
    }
    
    master {
        mfact = 0.7
        new_status = slave
        new_on_top = false
        orientation = left
    }
    
	cursor {
	    no_hardware_cursors = true
	    inactive_timeout = 0
	}

	misc {
    vfr = true
    vrr = 0
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

    animations {
    enabled = true
    
    bezier = linear, 0, 0, 1, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    
    animation = global, 1, 2, linear
    
    # animation = workspaces, 1, 6, smooth, slidefade 20%
    # animation = workspacesIn, 1, 6, smooth, slidefade 20%  
    # animation = workspacesOut, 1, 6, smooth, slidefade 20%
    
    # animation = specialWorkspace, 1, 6, smooth, slidefade 20%
    # animation = specialWorkspaceIn, 1, 6, smooth, slidefade 20%
    # animation = specialWorkspaceOut, 1, 6, smooth, slidefade 20%
    
    # animation = windows, 1, 7, quick, popin 80%
    # animation = windowsOut, 1, 5, quick, popin 80%
    # animation = fade, 1, 8, smooth
}
