# --- INITIALIZE SESSION (WAJIB PALING ATAS) ---
exec-once = uwsm finalize

# --- 🖥️ MONITOR SETTINGS ---------------------------------------------------
# Apply monitor presets via ddcutil
exec-once = sleep 1 && uwsm app -- ddcutil setvcp 10 100 12 100 14 07 6C 40 6E 40 70 40 16 45 18 45 1a 45
# Dont Forget install
# sudo pacman -S ddcutil
# sudo modprobe i2c-dev
# sudo tee /etc/modules-load.d/i2c-dev.conf

# PORTAL
exec-once = uwsm app -- xdg-desktop-portal-hyprland
exec-once = uwsm app -- xdg-desktop-portal-gtk

# Set Cursor 
exec-once = hyprctl setcursor volantes_light_cursors 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'volantes_light_cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# --- 🛡️ SECURITY & CORE SERVICES -------------------------------------------
#exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

# GNOME Keyring
exec-once = uwsm app -- gnome-keyring-daemon --start --components=secrets

# Network Manager Applet
exec-once = uwsm app -- nm-applet --indicator

# --- 📋 CLIPBOARD MANAGER -------------------------------------------------
# Clipboard history
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

# --- 🔋 POWER & HARDWARE --------------------------------------------------
# Idle Management
#exec-once = uwsm app -- hypridle

# --- TASKBAR ---------------------------------------------------
# Waybar dengan delay 2s
exec-once = sleep 2 && uwsm app -- waybar

# --- WP (WALLPAPER) ---------------------------------------------------
exec-once = uwsm app -- hyprpaper
