# --- DESKTOP IDENTITY ---
env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card:/dev/dri/by-path/pci-0000:00:02.0-card
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CONFIG_HOME,$HOME/.config

# --- TOOLKIT INTEGRATION ---
env = TERMINAL,kitty
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,0
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- NVIDIA SPECIFIC (The Stabilizers) ---
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# FIX: Kurangi stuttering di driver closed
env = WLR_DRM_NO_ATOMIC,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

# --- CURSOR & PERFORMANCE ---
# Pakai WLR_NO_HARDWARE_CURSORS untuk kompatibilitas maksimal
env = WLR_NO_HARDWARE_CURSORS,1
env = CURSOR_SENSITIVITY,1.0
env = HYPRCURSOR_THEME,volantes_light_cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,volantes_light_cursors
env = XCURSOR_SIZE,24

# Screenshot
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots