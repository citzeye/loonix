# --- ENVIRONMENTS --------------------------------------

    # Desktop Identity
    env = XDG_CURRENT_DESKTOP,Hyprland
    env = XDG_SESSION_TYPE,wayland
    env = XDG_SESSION_DESKTOP,Hyprland

    # Toolkit Integration (Fix Thunar & Apps)
    env = TERMINAL,kitty
    env = GDK_BACKEND,wayland,x11
    env = QT_QPA_PLATFORM,wayland;xcb
    env = QT_AUTO_SCREEN_SCALE_FACTOR,1
    env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
    env = QT_QPA_PLATFORMTHEME,qt5ct

	# NVIDIA Specific
	env = LIBVA_DRIVER_NAME,nvidia
	env = __GLX_VENDOR_LIBRARY_NAME,nvidia
    env = __NV_PRIME_RENDER_OFFLOAD,1
	env = GBM_BACKEND,nvidia-drm
	env = ELECTRON_OZONE_PLATFORM_HINT,auto
	env = xwayland,use_nearest_neighbor,1

	# For OLD HARDWARE:
	env = WLR_NO_HARDWARE_CURSORS,1
	env = __GL_MAX_FRAMES_IN_FLIGHT,1
    
    # CURSOR & PERFORMANCE
    env = CURSOR_SENSITIVITY,1.0
	env = HYPRCURSOR_THEME,volantes_light_cursors
	env = HYPRCURSOR_SIZE,24
	env = XCURSOR_THEME,volantes_light_cursors
    env = XCURSOR_SIZE,24

    env = __GL_GSYNC_ALLOWED,1
    env = __GL_VRR_ALLOWED,1
	env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots