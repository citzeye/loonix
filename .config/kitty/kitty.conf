# --- Shell & Font ---
shell                       zsh
font_family                 Kode Mono
bold_font                   Kode Mono Bold
italic_font                 Kode Mono Italic
bold_italic_font            Kode Mono Bold Italic
font_size                   9.5

# Fallback symbol & emoji
symbol_map                  U+E000-U+F8FF 3270 Nerd Font Mono
symbol_map                  U+1F300-U+1F9FF Twemoji

cursor_shape                underline
cursor_blink_interval       0.5
cursor_stop_blinking_after  0
cursor_underline_thickness  2.0

# --- Window & Rounding Fix ---
remember_window_size        yes
initial_window_width        950
initial_window_height       500
window_padding_width        0 3
hide_window_decorations     yes
confirm_os_window_close     0

# --- Appearance (Cyberpunk Vibe) ---
background_opacity          0.75
dynamic_background_opacity  yes
background                  #162327

# --- Mouse & Copy-Paste ---
copy_on_select              yes
mouse_map middle release ungrabbed paste_from_selection
mouse_map right press ungrabbed paste_from_clipboard

# --- Keymaps ---
map ctrl+shift+c            copy_to_clipboard
map ctrl+shift+v            paste_from_clipboard
map ctrl+shift+insert       paste_from_selection

# --- Performance & Misc ---
repaint_delay               10
input_delay                 3
sync_to_monitor             yes
enable_audio_bell           no

# Hyprland integration
window_margin_width         0
single_window_margin_width  0
draw_minimal_borders        yes

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
